name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q MMD-G88-android-project.zip
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.5 }
      - run: cd MMD-G88 && bash fetch-libs.sh && gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MMD-G88-apk
          path: MMD-G88/app/build/outputs/apk/release/*.apk
